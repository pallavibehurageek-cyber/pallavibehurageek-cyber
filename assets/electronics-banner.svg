<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="330" viewBox="0 0 1200 330" role="img" aria-labelledby="title desc">
  <title id="title">Pallavi Behura — Electronics and Hardware Engineering</title>
  <desc id="desc">A dark circuit-board-inspired banner with cyan PCB traces and a digital chip motif.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#071522"/><stop offset="55%" stop-color="#0B1E2D"/><stop offset="100%" stop-color="#08111F"/>
    </linearGradient>
    <linearGradient id="cyan" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#67F7FF"/><stop offset="100%" stop-color="#00BFA6"/>
    </linearGradient>
    <pattern id="grid" width="28" height="28" patternUnits="userSpaceOnUse">
      <path d="M28 0H0V28" fill="none" stroke="#16445A" stroke-width="0.7" opacity="0.55"/>
      <circle cx="0" cy="0" r="1.4" fill="#00D9FF" opacity="0.5"/>
    </pattern>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3" result="blur"/><feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="1200" height="330" rx="20" fill="url(#bg)"/>
  <rect width="1200" height="330" rx="20" fill="url(#grid)" opacity="0.8"/>
